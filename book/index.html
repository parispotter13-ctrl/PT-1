<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book your session — FORM/FORWARD</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .booking-page{max-width:900px;margin:auto;padding:70px 5vw}
    .booking-page h1{font-size:clamp(42px,7vw,76px);line-height:.92;letter-spacing:-.07em}
    .day{background:#fff;padding:24px;margin:18px 0;border-radius:12px}
    .slots{display:flex;flex-wrap:wrap;gap:10px}
    .slot{padding:11px 14px;border:1px solid #cfd0c9;background:#fff;cursor:pointer;font:inherit}
    .slot:hover{background:var(--lime)}
    .notice{padding:16px;background:#e6efd2;margin:18px 0}
  </style>
</head>
<body>
  <header class="nav">
    <a class="wordmark" href="../index.html">FORM<span>/</span>FORWARD</a>
    <a href="../account/">My account</a>
  </header>

  <main class="booking-page">
    <p class="eyebrow">FOUNDATION MEMBER BOOKING</p>
    <h1>Choose your<br><em>session time.</em></h1>
    <p>Monday appointments are available between 09:00 and 17:00. You can hold one active booking at a time.</p>
    <div id="calendar"><p>Loading available appointments…</p></div>
  </main>

  <script defer crossorigin="anonymous"
    src="https://hot-eft-0.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
    type="text/javascript"></script>

  <script defer crossorigin="anonymous"

    src="https://hot-eft-0.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
    type="text/javascript"></script>

  <script>
    const calendar = document.querySelector("#calendar");

    function groupByDate(slots) {
      return slots.reduce((groups, slot) => {
        (groups[slot.date] ||= []).push(slot);
        return groups;
      }, {});
    }

    async function book(startsAt, button) {
      button.disabled = true;
      button.textContent = "Booking…";

      const token = await Clerk.session.getToken();

      const response = await fetch("/api/bookings/create", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          startsAt,
          programme: "Foundation"
        })
      });

      const result = await response.json();

      if (!response.ok) {
        alert(result.error?.message || "Unable to create booking.");
        button.disabled = false;
        button.textContent = startsAt.slice(11, 16);
        return;
      }

      calendar.innerHTML = `
        <div class="notice">
          <strong>Your booking is confirmed.</strong><br>
          ${new Date(`${result.data.startsAt}Z`).toLocaleString("en-GB", {
            weekday: "long",
            day: "numeric",
            month: "long",
            hour: "2-digit",
            minute: "2-digit",
            timeZone: "Europe/London"
          })}
        </div>
        <p><a class="button" href="../account/">Return to My account →</a></p>
      `;
    }

    window.addEventListener("load", async () => {
      try {
        await Clerk.load({
          ui: { ClerkUI: window.__internal_ClerkUICtor }
        });

        if (!Clerk.isSignedIn) {
          Clerk.openSignIn({
            afterSignInUrl: window.location.href,
            afterSignUpUrl: window.location.href
          });
          return;
        }

        const response = await fetch("/api/bookings/availability");
        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error("Availability could not be loaded.");
        }

        const groups = groupByDate(result.data.slots);
